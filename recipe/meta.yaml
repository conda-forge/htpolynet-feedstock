{% set name = "htpolynet" %}
{% set version = "2.4.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/htpolynet-{{ version }}.tar.gz
  sha256: 5cd039b447f4b156b0db9744f6d5f8eafa7342f3e5d648b7c878ddba42a60e68

build:
  entry_points:
    - htpolynet = htpolynet.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - pyyaml >=6
    - requests >=2.28
    - pandas >=2
    - scipy >=1.10
    - parmed >=4
    - networkx >=3.2
    - gputil >=1.4
    - matplotlib-base
    - python-graphviz >=0.20
    - graphviz
    - rdkit >=2024.03
    - setuptools
    - ambertools

test:
  imports:
    - htpolynet
  commands:
    # No `pip check` here.  It inspects every installed distribution, and
    # ambertools bundles several (fetkutils, ndfes, packmol-memgen, proprep,
    # edgembar) whose metadata is unsatisfiable under current conda-forge
    # pins -- missing netcdf4/pdb2pqr, and requirements of numpy<2 and
    # biopython<1.86 against the numpy 2 and biopython 1.88 that get
    # installed.  So it fails on their account and never on htpolynet's,
    # which imports and runs cleanly.  It blocked every version bump from
    # 2.2.0 through 2.4.0.
    - htpolynet --help
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Automated MD System Builder for Amorphous Network Polymers
  dev_url: https://github.com/cameronabrams/htpolynet
  home: https://github.com/cameronabrams/htpolynet
  doc_url: https://htpolynet.readthedocs.io/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cameronabrams
